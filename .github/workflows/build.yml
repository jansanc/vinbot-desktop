# Builds the Windows and macOS installers. macOS builds need a Mac, so this is
# the way to produce them from a Windows machine.
#
#   - Run it by hand (Actions > Build installers > Run workflow) and download
#     the installers from the run's artifacts.
#   - Or push a version tag (git tag v1.0.1 && git push origin v1.0.1) to also
#     get a draft GitHub Release with the installers attached. Installed apps
#     update from this repo's releases once one is published
#     (src/main/updater.ts).
#
# Without the Apple secrets below, the macOS app is only ad-hoc signed: it runs,
# but macOS blocks it on first open (see vault/RELEASING.md).
name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # electron-builder versions the build from package.json, not the tag: a
      # tag without the bump ships the old version under a new release, which
      # installed apps see as nothing new (v1.2.3 shipped 1.2.1)
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME but package.json says $version. Bump the version, commit, and tag again."
            exit 1
          fi

      - run: npm ci

      # Electron 44 fetches its binary on first run, not on install, and
      # dist:win packages the copy in node_modules/electron/dist. Done here
      # too (not only in dist:win) so older tags still build.
      - name: Download Electron
        run: node node_modules/electron/install.js

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: npm run dist:win

      - name: Build (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          # Developer ID Application certificate (.p12, base64) and its password
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          # Notarization; electron-builder notarizes when these are set
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            npm run dist:mac
          else
            echo "::warning::No Apple certificate configured; building an ad-hoc signed, un-notarized app"
            unset CSC_LINK CSC_KEY_PASSWORD
            CSC_IDENTITY_AUTO_DISCOVERY=false npm run dist:mac -- -c.mac.identity=- -c.mac.hardenedRuntime=false
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist-app/*.exe
            dist-app/*.dmg
            dist-app/*.zip
            dist-app/*.blockmap
            dist-app/latest*.yml

  # A draft release in this (public) repo, which the apps read with no token.
  # Publishing the draft is what rolls the version out to every installed
  # copy, so check it first.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          # latest*.yml and *.blockmap are what the updater reads
          files: installers/*
