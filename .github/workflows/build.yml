# Builds the Windows and macOS installers and attaches them to a GitHub
# Release. macOS builds need a Mac, so this is the way to produce them from a
# Windows machine.
#
#   - Publish a release on GitHub (Releases > Draft a new release > Publish):
#     the installers are built from the release's tag and attached to it a few
#     minutes later. Any tag name works.
#   - For a release that already exists, or to rebuild one: Actions > Build
#     installers > Run workflow, and enter its tag (e.g. 1.0.0).
#   - Run it by hand with no tag to just build; download the installers from
#     the run's artifacts.
#
# Bump "version" in package.json before tagging: it names the files, and
# installed apps only update to a higher version.
#
# Installed apps update from this repo's latest published release
# (src/main/updater.ts), using the latest*.yml and *.blockmap attached here.
#
# Without the Apple secrets below, the macOS app is only ad-hoc signed: it runs,
# but macOS blocks it on first open (see vault/RELEASING.md).
name: Build installers

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach the installers to (empty: just build)"
        required: false
        default: ""

env:
  # The release's tag, or the one typed in; empty for a plain build.
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # GitHub sets CI=true, which makes react-scripts fail the build on any
      # lint warning.
      CI: false
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the tagged code, not whatever the branch has now.
          ref: ${{ env.RELEASE_TAG || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Electron 44 fetches its binary on first run, not on install, and
      # dist:win packages the copy in node_modules/electron/dist. Done here
      # too (not only in dist:win) so tags from before that script build.
      - name: Download Electron
        run: node node_modules/electron/install.js

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: npm run dist:win

      - name: Build (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          # Developer ID Application certificate (.p12, base64) and its password
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          # Notarization; electron-builder notarizes when these are set
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            npm run dist:mac
          else
            echo "::warning::No Apple certificate configured; building an ad-hoc signed, un-notarized app"
            unset CSC_LINK CSC_KEY_PASSWORD
            CSC_IDENTITY_AUTO_DISCOVERY=false npm run dist:mac -- -c.mac.identity=- -c.mac.hardenedRuntime=false
          fi

      # *.blockmap and latest*.yml are what installed apps read to update
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist-app/*.exe
            dist-app/*.dmg
            dist-app/*.zip
            dist-app/*.blockmap
            dist-app/latest*.yml

  # Attaches everything to the release. Once it is attached, installed apps
  # pick the version up (the repo is public, so they need no token).
  release:
    if: github.event_name == 'release' || inputs.tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l installers
          gh release upload "$RELEASE_TAG" installers/* --clobber --repo "$GITHUB_REPOSITORY"
