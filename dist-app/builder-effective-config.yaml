directories:
  output: dist-app
  buildResources: public
files:
  - filter:
      - build/**/*
      - dist/**/*
      - node_modules/**/*
      - public/**/*
extraMetadata:
  main: build/electron.js
appId: com.vinted.authenticator
productName: Vinted Authenticator
win:
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
extends: react-cra
electronVersion: 31.7.7
