# Builds the Windows and macOS installers. macOS builds need a Mac, so this is
# the way to produce them from a Windows machine.
#
#   - Run it by hand (Actions > Build installers > Run workflow) and download
#     the installers from the run's artifacts.
#   - Or push a version tag (git tag v1.0.1 && git push origin v1.0.1) to also
#     get a draft Release with the installers attached, in the public
#     jansanc/vinbot-desktop-releases repo. Installed apps update from there
#     once it is published (src/main/updater.ts). Needs the RELEASES_TOKEN
#     secret: a token that can write to that repo's contents.
#
# Without the Apple secrets below, the macOS app is only ad-hoc signed: it runs,
# but macOS blocks it on first open (see vault/RELEASING.md).
name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: npm run dist:win

      - name: Build (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          # Developer ID Application certificate (.p12, base64) and its password
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          # Notarization; electron-builder notarizes when these are set
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            npm run dist:mac
          else
            echo "::warning::No Apple certificate configured; building an ad-hoc signed, un-notarized app"
            unset CSC_LINK CSC_KEY_PASSWORD
            CSC_IDENTITY_AUTO_DISCOVERY=false npm run dist:mac -- -c.mac.identity=- -c.mac.hardenedRuntime=false
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist-app/*.exe
            dist-app/*.dmg
            dist-app/*.zip
            dist-app/*.blockmap
            dist-app/latest*.yml

  # A draft in the public releases repo: the source repo is private, and the
  # apps download updates with no token. Publishing the draft is what rolls
  # the version out to every installed copy, so check it first.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          repository: jansanc/vinbot-desktop-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          draft: true
          # latest*.yml and *.blockmap are what the updater reads
          files: installers/*
