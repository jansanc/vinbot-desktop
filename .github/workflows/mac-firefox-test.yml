# Temporary: reproduce "Firefox doesn't open" on real macOS VMs.
name: Mac Firefox test
on:
  push:
    branches: ["test/mac-firefox"]
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      VERSION: 1.2.5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: System info
        run: |
          exec > >(tee "$RUNNER_TEMP/0-system.log") 2>&1
          sw_vers; uname -m; spctl --status || true
          csrutil status || true
      - name: Download and install the released DMG (quarantined, like a browser download)
        run: |
          exec > >(tee "$RUNNER_TEMP/1-install.log") 2>&1
          DMG="Vinbot-Authenticator-$VERSION-mac-${{ matrix.arch }}.dmg"
          curl -sSLf -o "$RUNNER_TEMP/$DMG" "https://github.com/jansanc/vinbot-desktop/releases/download/v$VERSION/$DMG"
          xattr -w com.apple.quarantine "0083;$(printf %x $(date +%s));Safari;$(uuidgen)" "$RUNNER_TEMP/$DMG"
          hdiutil attach -nobrowse -mountpoint /Volumes/vinbot "$RUNNER_TEMP/$DMG"
          ls -la /Volumes/vinbot
          ditto "/Volumes/vinbot/Vinbot Authenticator.app" "/Applications/Vinbot Authenticator.app"
          APP="/Applications/Vinbot Authenticator.app"
          xattr -lr "$APP" | grep -c quarantine || true
          ls -la "$APP/Contents/Resources/firefox" "$APP/Contents/Resources/firefox/Firefox.app/Contents/MacOS" | head -40
          file "$APP/Contents/Resources/firefox/Firefox.app/Contents/MacOS/firefox"
          file "$APP/Contents/MacOS/Vinbot Authenticator"
          codesign -dv --verbose=2 "$APP" 2>&1 || true
          codesign --verify --deep --strict --verbose=2 "$APP/Contents/Resources/firefox/Firefox.app" 2>&1 || true
          codesign -dv --verbose=2 "$APP/Contents/Resources/firefox/Firefox.app" 2>&1 || true
          spctl -a -vv -t exec "$APP/Contents/Resources/firefox/Firefox.app" 2>&1 || true
          cat "$APP/Contents/Resources/firefox/Firefox.app/Contents/Resources/application.ini" 2>/dev/null | head -10 || true
      - name: Launch the bundled Firefox directly (same args as the app)
        run: |
          exec > >(tee "$RUNNER_TEMP/2-direct.log") 2>&1
          FF="/Applications/Vinbot Authenticator.app/Contents/Resources/firefox/Firefox.app/Contents/MacOS/firefox"
          PROFILE=$(mktemp -d)
          "$FF" -no-remote -new-instance -profile "$PROFILE" "https://www.vinted.es" > "$RUNNER_TEMP/ff-direct.log" 2>&1 &
          PID=$!
          for i in 1 2 3 4 5 6; do
            sleep 5
            if kill -0 $PID 2>/dev/null; then echo "t=$((i*5))s alive"; else wait $PID; echo "t=$((i*5))s EXITED code=$?"; break; fi
          done
          screencapture -x "$RUNNER_TEMP/direct.png" || true
          echo "--- windows"; osascript -l JavaScript scripts/mac-test/windows.js || true
          ps -axo pid,ppid,etime,command | grep -i [f]irefox | cut -c1-200 || true
          kill $PID 2>/dev/null || true; sleep 3; kill -9 $PID 2>/dev/null || true
          echo "--- firefox output"; tail -50 "$RUNNER_TEMP/ff-direct.log"
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run compile:main
      - name: Run the app's login code under Electron with the bundled Firefox
        run: |
          rm -rf vendor/firefox && mkdir -p vendor/firefox
          ditto "/Applications/Vinbot Authenticator.app/Contents/Resources/firefox/Firefox.app" vendor/firefox/Firefox.app
          ( sleep 15; screencapture -x "$RUNNER_TEMP/login-15s.png"; osascript -l JavaScript scripts/mac-test/windows.js; ps -axo pid,ppid,etime,command | grep -i [f]irefox | cut -c1-200 ) > "$RUNNER_TEMP/3b-during-login.log" 2>&1 &
          LOGIN_TIMEOUT=40 npx electron scripts/mac-test/login-main.js 2>&1 | grep -v "^\s*$" > "$RUNNER_TEMP/3-login.log"; cat "$RUNNER_TEMP/3-login.log"
      - name: Launch the installed app itself and watch for crashes
        run: |
          exec > >(tee "$RUNNER_TEMP/4-app.log") 2>&1
          APP="/Applications/Vinbot Authenticator.app"
          "$APP/Contents/MacOS/Vinbot Authenticator" > "$RUNNER_TEMP/app-out.txt" 2>&1 &
          PID=$!
          sleep 20
          screencapture -x "$RUNNER_TEMP/app.png" || true
          kill -0 $PID && echo "app alive" || echo "app exited"
          kill $PID 2>/dev/null || true
          head -80 "$RUNNER_TEMP/app-out.txt"
          ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | tail -20 || true
          log show --last 5m --predicate 'process == "syspolicyd" OR process == "taskgated" OR eventMessage CONTAINS[c] "firefox"' 2>/dev/null | tail -60 || true
      # Job logs need a token; annotations are public, so report through them
      - name: Report
        if: always()
        run: |
          for f in "$RUNNER_TEMP"/[0-9]*.log; do
            body=$(tail -c 30000 "$f" | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::notice title=${{ matrix.arch }} $(basename "$f")::$body"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mac-test-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/*.png
            ${{ runner.temp }}/*.log
